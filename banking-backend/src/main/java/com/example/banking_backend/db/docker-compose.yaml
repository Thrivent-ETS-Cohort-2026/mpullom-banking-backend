services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: bank_db
      POSTGRES_USER: banker
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - bank-data:/var/lib/postgresql/data 
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banker -d bank_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bank-data: 
